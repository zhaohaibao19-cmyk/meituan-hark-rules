name: 美团去广告（Hark）
description: 拦截美团 App / 美团外卖广告接口与广告素材；响应脚本还会隐藏指定推荐、入口、搜索词和技能卡。HTTPS 改写需开启 MITM 并信任证书。
author: Hark ctx 适配（参考 ihxperfect/loon-plugin、BlueGrave/Surge、ZenmoFeiShi/Qx）

# 规则参考：
# https://github.com/ihxperfect/loon-plugin/blob/main/AdBlock.plugin
# https://github.com/BlueGrave/Surge/blob/master/Module/WhiteList.sgmodule
# https://raw.githubusercontent.com/muktsoen/SurgeRules/main/MT.sgmodule
# 上游响应逻辑：https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/MT.js

rules:
  - domain:
      match: portal-portm.meituan.com
      policy: REJECT

url_rewrites:
  # 美团外卖开屏 / 状态广告接口
  - match: "^https?:\\/\\/wmapi\\.meituan\\.com\\/api\\/v\\d+\\/loadInfo\\?"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/wmapi\\.meituan\\.com\\/api\\/v\\d+\\/startpicture"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/www\\.meituan\\.com\\/api\\/v\\d+\\/appstatus\\?ad"
    location: "http://reject-dict/"
  - match: "^https?:\\/\\/peisongapi\\.meituan\\.com\\/client\\/getInitiateImage"
    location: "http://reject-dict/"

  # 仅拦截社区规则标记的广告素材目录；保留其余图片资源
  - match: "^https?:\\/\\/img\\.meituan\\.net\\/(adunion|display|dpmobile|midas)\\/\\w+\\.(gif|jpg|jpg\\.webp)$"
    location: "http://reject-200/"
  - match: "^https?:\\/\\/img\\.meituan\\.net\\/(bizad|brandCpt)\\/\\w+\\.(png|jpg)$"
    location: "http://reject-200/"
  - match: "^https?:\\/\\/p\\d\\.meituan\\.net\\/(bizad|wmbanner)\\/\\w+\\.jpg"
    location: "http://reject-200/"
  - match: "^https?:\\/\\/(s3plus|flowplus)\\.meituan\\.net\\/v\\d\\/\\w+\\/linglong\\/\\w+\\.(gif|jpg|mp4)"
    location: "http://reject-200/"

# Hark/Egern ctx 响应脚本，覆盖上游的 8 个精确接口；解析失败时原样放行。
scriptings:
  - http_response:
      name: 美团去广告（Hark）
      match: '^https?://(?:apimobile\.meituan\.com/(?:aggroup/indexTab|group/v1/deal/searchpage/defaultword|group/v1/deal/searchpage/hotword/city/divide/hotrecommend/)|feedguess\.meituan\.com/lycoris/scene/(?:gwc_feed1_2265|personalcenter_2154)|mt-personalcenter\.meituan\.com/usercenter/display|assistify\.meituan\.com/assistant/getAppClientHornConfig|mop\.meituan\.com/(?:mop/entry/shoppingCartEntry|api/entryModule/startupPicture))(?:[/?#]|$)'
      script_url: "https://raw.githubusercontent.com/zhaohaibao19-cmyk/meituan-hark-rules/main/Meituan-hark.js"
      body_required: true
      max_size: 2097152
      timeout: 15

# 仅覆盖现有 URL 重写及响应脚本实际用到的主机；p0-p9 对应现存 p\d 素材规则。
mitm:
  hostnames:
    includes:
      - wmapi.meituan.com
      - www.meituan.com
      - peisongapi.meituan.com
      - img.meituan.net
      - p0.meituan.net
      - p1.meituan.net
      - p2.meituan.net
      - p3.meituan.net
      - p4.meituan.net
      - p5.meituan.net
      - p6.meituan.net
      - p7.meituan.net
      - p8.meituan.net
      - p9.meituan.net
      - s3plus.meituan.net
      - flowplus.meituan.net
      - apimobile.meituan.com
      - feedguess.meituan.com
      - mt-personalcenter.meituan.com
      - assistify.meituan.com
      - mop.meituan.com
